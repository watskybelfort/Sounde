<!doctype html>
<html lang="es" data-focused="true" data-backdrop="acrylic" data-mini="false" data-lateral="abierto">
<head>
  <meta charset="utf-8">
  <!-- CSP estricta: sin 'unsafe-inline'. Por eso en el codigo no hay ni un
       atributo style="" ni un <style> suelto: todo lo dinamico se hace por
       CSSOM (el.style.setProperty), que la CSP si permite. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self';
                 style-src 'self';
                 img-src 'self' data: blob: sounde-art:;
                 media-src 'self' sounde-file:;
                 font-src 'self';
                 connect-src 'self' sounde-art: sounde-file:">
  <title>Sounde</title>
  <link rel="stylesheet" href="styles/acrylic.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/lista.css">
  <link rel="stylesheet" href="styles/vistas.css">
  <link rel="stylesheet" href="styles/cola.css">
  <link rel="stylesheet" href="styles/titlebar.css">
  <link rel="stylesheet" href="styles/transport.css">
</head>
<body>

<div class="app">

  <header class="titlebar">
    <div class="titlebar__marca">
      <svg class="titlebar__logo" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 8h1.4M5 5v6M8 2.6v10.8M11 5v6M13.6 8H15"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span>Sounde</span>
    </div>

    <div class="titlebar__ahora truncar" id="titulo-ahora">Sounde</div>

    <div class="titlebar__espacio"></div>

    <div class="titlebar__controles">
      <button class="titlebar__btn" id="btn-minimizar" title="Minimizar" aria-label="Minimizar">&#xE921;</button>
      <button class="titlebar__btn" id="btn-maximizar" title="Maximizar" aria-label="Maximizar">&#xE922;</button>
      <button class="titlebar__btn titlebar__btn--cerrar" id="btn-cerrar" title="Cerrar" aria-label="Cerrar">&#xE8BB;</button>
    </div>
  </header>

  <nav class="lateral" aria-label="Navegacion">
    <div class="lateral__grupo">
      <button class="lateral__item" id="btn-plegar" title="Plegar el panel" aria-label="Plegar el panel">
        <span class="lateral__icono" id="icono-plegar" aria-hidden="true"></span>
      </button>
    </div>

    <div class="lateral__grupo">
      <span class="lateral__titulo">Biblioteca</span>
      <button class="lateral__item" id="nav-canciones" aria-current="true">
        <span class="lateral__icono" id="icono-canciones" aria-hidden="true"></span>
        <span class="lateral__texto">Canciones</span>
        <span class="lateral__cuenta tabular" id="cuenta-canciones"></span>
      </button>
      <button class="lateral__item" id="nav-albumes" aria-current="false">
        <span class="lateral__icono" id="icono-albumes" aria-hidden="true"></span>
        <span class="lateral__texto">Albumes</span>
      </button>
      <button class="lateral__item" id="nav-artistas" aria-current="false">
        <span class="lateral__icono" id="icono-artistas" aria-hidden="true"></span>
        <span class="lateral__texto">Artistas</span>
      </button>
      <button class="lateral__item" id="nav-favoritos" aria-current="false">
        <span class="lateral__icono" id="icono-favoritos" aria-hidden="true"></span>
        <span class="lateral__texto">Favoritos</span>
        <span class="lateral__cuenta tabular" id="cuenta-favoritos"></span>
      </button>
      <button class="lateral__item" id="nav-recientes" aria-current="false">
        <span class="lateral__icono" id="icono-recientes" aria-hidden="true"></span>
        <span class="lateral__texto">Recientes</span>
      </button>
    </div>

    <div class="lateral__grupo">
      <span class="lateral__titulo">
        Carpetas
        <button class="lateral__accion" id="btn-reescanear" title="Volver a escanear" aria-label="Volver a escanear"></button>
      </span>
      <div class="lateral__carpetas" id="lista-carpetas"></div>
    </div>

    <div class="lateral__grupo lateral__pie">
      <button class="boton boton--ancho" id="btn-anadir-carpeta" title="Anadir una carpeta de musica">
        <span class="boton__icono" id="icono-anadir" aria-hidden="true"></span>
        <span class="boton__texto">Anadir carpeta</span>
      </button>
      <button class="boton boton--ancho" id="btn-abrir-archivos" title="Abrir archivos sueltos">
        <span class="boton__icono" id="icono-abrir" aria-hidden="true"></span>
        <span class="boton__texto">Abrir archivos</span>
      </button>
    </div>
  </nav>

  <section class="vista">
    <header class="vista__cabecera">
      <div>
        <h1 class="vista__titulo" id="vista-titulo">Canciones</h1>
        <div class="vista__resumen" id="vista-resumen">Sin musica todavia</div>
      </div>
      <div class="vista__acciones" id="vista-acciones" data-ficha="false">
        <div class="escaneo" id="escaneo" hidden>
          <span id="escaneo-texto">Escaneando…</span>
          <div class="escaneo__barra"><div class="escaneo__relleno"></div></div>
        </div>
        <label class="buscador vista__solo-lista">
          <span class="buscador__icono" id="icono-buscar" aria-hidden="true"></span>
          <input class="buscador__campo" id="buscador" type="text" spellcheck="false"
                 placeholder="Buscar" aria-label="Buscar en la biblioteca">
        </label>
        <button class="icono-btn vista__solo-lista" id="btn-tocar-todo" title="Reproducir todo" aria-label="Reproducir todo"></button>
        <button class="icono-btn vista__solo-lista" id="btn-tocar-aleatorio" title="Reproducir en aleatorio" aria-label="Reproducir en aleatorio"></button>
      </div>
    </header>

    <div class="vista__cuerpo" id="vista-cuerpo"></div>
  </section>

  <footer class="transporte">

    <div class="ahora">
      <div class="ahora__arte" id="ahora-arte">
        <img class="ahora__imagen" id="ahora-imagen" alt="" hidden>
      </div>
      <div class="ahora__textos">
        <div class="ahora__titulo truncar" id="ahora-titulo">Nada sonando</div>
        <div class="ahora__artista truncar" id="ahora-artista">Elige algo y dale al play</div>
      </div>
      <button class="icono-btn ahora__fav" id="btn-favorito" aria-pressed="false"
              title="Anadir a favoritos" aria-label="Anadir a favoritos"></button>
    </div>

    <div class="mandos">
      <div class="mandos__fila">
        <button class="icono-btn" id="btn-aleatorio" aria-pressed="false" title="Aleatorio" aria-label="Aleatorio"></button>
        <button class="icono-btn" id="btn-anterior" title="Anterior" aria-label="Anterior"></button>
        <button class="mandos__reproducir" id="btn-reproducir" title="Reproducir" aria-label="Reproducir"></button>
        <button class="icono-btn" id="btn-siguiente" title="Siguiente" aria-label="Siguiente"></button>
        <button class="icono-btn" id="btn-repetir" aria-pressed="false" title="Repetir" aria-label="Repetir"></button>
      </div>
      <div class="mandos__tiempo tabular">
        <span class="mandos__reloj" id="reloj-actual">0:00</span>
        <div class="barra" id="barra-tiempo" role="slider" tabindex="0"
             aria-label="Posicion" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="barra__pista">
            <div class="barra__buffer"></div>
            <div class="barra__relleno"></div>
            <div class="barra__pomo"></div>
          </div>
          <div class="barra__globo tabular" id="globo-tiempo">0:00</div>
        </div>
        <span class="mandos__reloj" id="reloj-total">0:00</span>
      </div>
    </div>

    <div class="extras">
      <button class="icono-btn" id="btn-paleta" aria-pressed="false" title="Fijar el color" aria-label="Fijar el color"></button>
      <button class="icono-btn" id="btn-cola" aria-pressed="false" title="Cola de reproduccion" aria-label="Cola de reproduccion"></button>
      <button class="icono-btn" id="btn-silencio" aria-pressed="false" title="Silenciar" aria-label="Silenciar"></button>
      <div class="barra barra--fina extras__volumen" id="barra-volumen" role="slider" tabindex="0"
           aria-label="Volumen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
        <div class="barra__pista">
          <div class="barra__relleno"></div>
          <div class="barra__pomo"></div>
        </div>
      </div>
      <button class="icono-btn" id="btn-mini" title="Mini reproductor" aria-label="Mini reproductor"></button>
    </div>

  </footer>

</div>

<div class="soltar" aria-hidden="true">
  <div class="soltar__marco">
    <span class="soltar__icono" id="soltar-icono"></span>
    <span>Suelta la musica aqui</span>
  </div>
</div>

<script type="module" src="js/boot.js"></script>
</body>
</html>
